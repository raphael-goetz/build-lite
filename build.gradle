plugins {
    id 'java'
    id "com.gradleup.shadow"  version "9.6.1"
    id 'org.jetbrains.kotlin.jvm' version "2.4.10"
    id "xyz.jpenilla.run-paper" version "3.1.0"
    id "io.gitlab.arturbosch.detekt" version "1.23.8"
}

def tagVersion = System.getenv('VERSION')
group = "de.raphaelgoetz"
version = tagVersion ?: '0.0.1-SNAPSHOT'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "GitHubPackages"
        url = "https://maven.pkg.github.com/raphael-goetz/astralis"
        credentials {
            username = project.findProperty("github_username") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("github_token") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.121-stable'
    api 'de.raphaelgoetz:astralis:0.0.20'

    implementation 'org.jetbrains.exposed:exposed-core:1.4.0'
    implementation 'org.jetbrains.exposed:exposed-jdbc:1.4.0'

    implementation('org.xerial:sqlite-jdbc:3.53.2.1')
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'com.zaxxer:HikariCP:7.1.0'

    implementation('software.amazon.awssdk:s3:2.46.18') {
        exclude group: 'software.amazon.awssdk', module: 'apache5-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client:2.46.18'

    testImplementation(platform('org.junit:junit-bom:6.1.3'))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.mockk:mockk:1.14.11'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// run-paper normally points the server directly at build/libs. Rebuilding the
// shadow jar while that server is running can replace the archive underneath
// Paper's lazy plugin classloader, producing seemingly random NoClassDefFoundError
// failures for classes that are present in the new jar. Give every run an
// immutable snapshot instead, isolated from all normal build and clean tasks.
runPaper {
    disablePluginJarDetection()
}

def runPluginFileName = "build-lite-dev-${System.currentTimeMillis()}.jar"
def runPluginDirectory = layout.projectDirectory.dir("run/.dev-plugins")
def prepareRunPlugin = tasks.register("prepareRunPlugin", Copy) {
    dependsOn(tasks.named("shadowJar"))
    from(tasks.named("shadowJar").flatMap { it.archiveFile })
    into(runPluginDirectory)
    rename { runPluginFileName }

    // The destination filename is unique for each Gradle invocation. A Copy
    // task normally tracks only its destination directory and could otherwise
    // be considered up-to-date because an older snapshot exists there.
    outputs.upToDateWhen { false }
}

tasks.named("runServer") {
    dependsOn(prepareRunPlugin)
    pluginJars(runPluginDirectory.file(runPluginFileName))
    it.minecraftVersion("26.2")
}
def targetJavaVersion = 25

kotlin {
    jvmToolchain(targetJavaVersion)
}

detekt {
    buildUponDefaultConfig = false
    config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
    source.setFrom(files("src/main/kotlin"))
}

tasks.named("build") {
    it.dependsOn("shadowJar")
}

tasks.named("processResources") {
    def props = [version: version]
    inputs.properties(props)
    filteringCharset = "UTF-8"
    filesMatching("paper-plugin.yml") {
        expand(props)
    }
}
